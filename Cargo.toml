[package]
name = "kalman-filter-rs"
version = "0.1.0"
edition = "2021"
authors = ["Rahad Bhuiya <rahadbhuiya2021@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "High-integrity, `#![no_std]` capable Kalman filtering engine in pure Rust with strict numerical validation and Joseph stabilized covariance updates."
readme = "README.md"
repository = "https://github.com/rahadbhuiya/kalman-filter-rs"
keywords = ["kalman-filter", "dsp", "state-estimation", "no-std", "aerospace"]
categories = ["algorithms", "embedded", "no-std", "science::robotics"]

[dependencies]
# Zero mandatory external dependencies for core no_std deterministic operation

[features]
default = ["std"]
std = []
