[package]
name = "aegis-filter"
version = "0.3.1"
edition = "2021"
authors = ["Rahad Bhuiya <rahadbhuiya2021@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "High-integrity, cyber-resilient state estimation and robust filtering engine in pure Rust with strict numerical validation, Joseph stabilized covariance updates, and outlier gating."
readme = "README.md"
repository = "https://github.com/Exploidus/aegis-filter"
keywords = ["kalman-filter", "state-estimation", "sensor-fusion", "no-std", "aerospace"]
categories = ["algorithms", "embedded", "no-std", "science::robotics"]

[lib]
name = "aegis_filter"
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }

[features]
default = ["std", "ffi"]
std = []
serde = ["dep:serde"]
ffi = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1


